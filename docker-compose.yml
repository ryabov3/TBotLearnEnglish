version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: tbot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: tbot_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: tbot_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  mongodb:
    image: mongo:5.0
    container_name: tbot_mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: tbot_opensearch
    restart: always
    environment:
      - "discovery.type=single-node"
      - "DISABLE_INSTALL_PLUGIN_CHECKS=true"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}"
    volumes:
      - os_data:/usr/share/opensearch/data

  graylog:
    image: graylog/graylog:5.2
    container_name: tbot_graylog
    restart: always
    environment:
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper12345678901234
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:9000/
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    depends_on:
      - mongodb
      - opensearch

  webapp:
    build: .
    container_name: tbot_webapp
    restart: always
    entrypoint: []
    command: ["uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${WEBAPP_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: tbot_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - webapp

  bot:
    build: .
    container_name: tbot_app
    restart: always
    depends_on:
      - db
      - redis
      - graylog
      - webapp
      - frontend
    env_file:
      - .env

volumes:
  db_data:
  redis_data:
  mongo_data:
  os_data:
